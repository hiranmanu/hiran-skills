name: Release consistency

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check every plugin's version is consistent
        run: python3 scripts/check_release_consistency.py
      - name: Install the builder's dependency
        run: npm install --no-audit --no-fund
        working-directory: plugins/cv-tailoring/skills/cv-tailoring/scripts
      - name: Syntax-check the scripts
        run: |
          python3 -m py_compile plugins/cv-tailoring/skills/cv-tailoring/scripts/validate_cv.py
          python3 -m py_compile plugins/cv-tailoring/skills/cv-tailoring/scripts/background_inbox.py
          node --check plugins/cv-tailoring/skills/cv-tailoring/scripts/build_cv.js
      - name: Tests (validator, parallel-safe fact inbox, end-to-end build + validate)
        run: python3 -m unittest discover -s tests -v
